[package]
name = "attentive-desktop"
version = "0.1.2"
description = "Windows notification bridge for Attentive Kit"
authors = ["Attentive Kit"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "attentive_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
attentive-notifier = "0.1.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["net", "sync", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
